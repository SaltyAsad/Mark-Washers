<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <h1>Register for Mark Washers</h1>
    <p>Create an account to manage your vehicle wash services.</p>
    <form action="submit_registration" method="post">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br>
        
        <button type="submit">Register</button>
    </form>
    <script src="script.js"></script>
    <p>Already have an account? <a href="login.html">Login here</p>
    <p>Return to <a href="index.html">home</a>.</p>
    <p>For assistance, contact support at <a href="mailto:support@mark">support@mark</a>.</p>
</body>
</html>
